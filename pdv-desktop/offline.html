<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Ponto X - sem conexão</title>
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;font-family:Arial,sans-serif;text-align:center}
  h1{font-size:28px;margin:0 0 8px}
  p{color:#bbb;margin:4px 0}
</style>
</head>
<body>
  <h1>Sem conexão com a internet</h1>
  <p>Tentando reconectar automaticamente…</p>
  <p>Pressione F5 para tentar agora.</p>
  <script>
    const url = new URLSearchParams(location.search).get('url');
    setInterval(() => {
      fetch(url, { method: 'HEAD', mode: 'no-cors' }).then(() => { location.href = url; }).catch(() => {});
    }, 5000);
  </script>
</body>
</html>
